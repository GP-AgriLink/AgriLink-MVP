<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Circle Background -->
  <circle cx="64" cy="64" r="58" fill="url(#aiGradient)" opacity="0.15"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#aiGradient)" stroke-width="3" opacity="0.3"/>
  
  <!-- AI Sparkle Star -->
  <g filter="url(#glow)">
    <!-- Center star burst -->
    <path d="M64 20 L68 54 L102 58 L68 62 L64 96 L60 62 L26 58 L60 54 Z" fill="url(#aiGradient)"/>
    
    <!-- Small sparkles -->
    <circle cx="90" cy="35" r="4" fill="url(#aiGradient)"/>
    <circle cx="38" cy="40" r="3" fill="url(#aiGradient)"/>
    <circle cx="92" cy="88" r="3" fill="url(#aiGradient)"/>
    <circle cx="36" cy="85" r="4" fill="url(#aiGradient)"/>
  </g>
  
  <!-- Neural network nodes -->
  <g opacity="0.6">
    <circle cx="48" cy="64" r="3" fill="url(#aiGradient)"/>
    <circle cx="80" cy="64" r="3" fill="url(#aiGradient)"/>
    <circle cx="64" cy="76" r="3" fill="url(#aiGradient)"/>
    <line x1="48" y1="64" x2="80" y2="64" stroke="url(#aiGradient)" stroke-width="1.5"/>
    <line x1="48" y1="64" x2="64" y2="76" stroke="url(#aiGradient)" stroke-width="1.5"/>
    <line x1="80" y1="64" x2="64" y2="76" stroke="url(#aiGradient)" stroke-width="1.5"/>
  </g>
</svg>
